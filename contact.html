<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Performance Solutions</title>
    <style>
        /* Global Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0b0b;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Bar */
        header {
            background-color: #121212;
            border-bottom: 1px solid #222222;
            position: relative;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #b0b0b0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #e53935;
        }

        /* Mobile Menu Toggle Button */
        #menuToggle {
            background: none;
            border: none;
            cursor: pointer;
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
        }

        #menuToggle .bar {
            width: 25px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        /* Mobile Dropdown Menu */
        #mobileMenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: #121212;
            border-bottom: 1px solid #222222;
            padding: 1.5rem 2rem;
            flex-direction: column;
            gap: 1rem;
        }

        #mobileMenu.open {
            display: flex;
        }

        #mobileMenu a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.5rem 0;
            border-bottom: 1px solid #1a1a1a;
        }

        /* Main Content Area */
        main {
            flex: 1;
            padding: 3rem 1rem;
        }

        /* Contact Form Styles */
        .ls-contact-wrapper {
            max-width: 700px;
            margin: 0 auto;
            background: #121212;
            border: 1px solid #222222;
            border-top: 3px solid #e53935;
            padding: 2.5rem;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .ls-form-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ls-form-header p {
            margin: 0 0 2rem 0;
            color: #999999;
            font-size: 0.95rem;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .ls-form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 1.25rem;
        }

        .ls-contact-wrapper label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b0b0b0;
            margin-bottom: 0.5rem;
        }

        .ls-contact-wrapper input,
        .ls-contact-wrapper select,
        .ls-contact-wrapper textarea {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            width: 100%;
        }

        .ls-contact-wrapper select {
            cursor: pointer;
        }

        .ls-contact-wrapper input:focus,
        .ls-contact-wrapper select:focus,
        .ls-contact-wrapper textarea:focus {
            border-color: #e53935;
            box-shadow: 0 0 0 2px rgba(229, 57, 53, 0.15);
        }

        .ls-submit-btn {
            width: 100%;
            background-color: #e53935;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 1rem;
        }

        .ls-submit-btn:hover {
            background-color: #d32f2f;
        }

        .ls-submit-btn:active {
            transform: scale(0.98);
        }

        /* Footer */
        footer {
            background-color: #121212;
            border-top: 1px solid #222222;
            text-align: center;
            padding: 1.5rem;
            color: #777777;
            font-size: 0.85rem;
        }

        /* Responsive Breakpoint */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            #menuToggle {
                display: flex;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .ls-contact-wrapper {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Brand Name</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="merchandise.html">Merchandise</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <button id="menuToggle" aria-label="Toggle Navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>

        <!-- Mobile Navigation Menu -->
        <nav id="mobileMenu">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="merchandise.html">Merchandise</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main Section with Contact Form -->
    <main>
        <div class="ls-contact-wrapper">
            <div class="ls-form-header">
                <h1>Contact Us</h1>
                <p>Connect with our team for professional service and custom performance solutions.</p>
            </div>
            
            <form class="ls-contact-form">
                <div class="form-row">
                    <div class="ls-form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="ls-form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="ls-form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000">
                    </div>
                    <div class="ls-form-group">
                        <label for="subject">Service / Inquiry Type</label>
                        <select id="subject" name="subject">
                            <option value="custom">Custom Build / Performance</option>
                            <option value="diagnostic">Diagnostics & Tuning</option>
                            <option value="general">General Inquiry</option>
                        </select>
                    </div>
                </div>
                
                <div class="ls-form-group">
                    <label for="message">Project Details / Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us what you're working on..." required></textarea>
                </div>
                
                <button type="submit" class="ls-submit-btn">Submit Inquiry</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 All Rights Reserved.</p>
    </footer>

    <!-- JavaScript for Mobile Menu Toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const mobileMenu = document.getElementById('mobileMenu');

            if (menuToggle && mobileMenu) {
                menuToggle.addEventListener('click', function() {
                    mobileMenu.classList.toggle('open');
                });
            }
        });
    </script>
</body>
</html>
