<!-- Service Request Form Section -->
<section class="details-grid">
    <div class="container form-container">
        <h2>Service Request</h2>
        <div class="contact-form">
            <form action="mailto:autocrossllc.services@gmail.com" method="post" enctype="text/plain">
                <input type="text" name="Name" placeholder="Full Name" required>
                <input type="tel" name="Phone" placeholder="Phone Number" required>
                <select name="Service_Type" required>
                    <option value="" disabled selected>Select Service</option>
                    <option value="LS Swap">LS Swap / Performance</option>
                    <option value="General Repair">General Repair / Diagnostics</option>
                    <option value="Marine/Trailer">Marine & Trailer Repair</option>
                    <option value="Rental">Vehicle Rental Request</option>
                </select>
                <input type="date" name="Date" required>
                <textarea name="Details" placeholder="Vehicle Details & Project Goals..." rows="5"></textarea>
                
                <button type="submit" class="btn-primary form-submit-btn">Send Request</button>
            </form>
        </div>
    </div>
</section>
