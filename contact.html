<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us & Service Estimator | AutoCross LLC</title>
    <meta name="description" content="Get in touch with AutoCross LLC for mobile LS performance, diagnostics, service rates, and shop scheduling in Southern California. Call or text 840-249-4620.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .ticker-wrap {
            position: absolute;
            top: 0;
            width: 100%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255, 0, 51, 0.3);
            white-space: nowrap;
            z-index: 1001;
            height: 35px;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            animation: ticker 25s linear infinite;
            padding-left: 100%;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .ticker-item {
            display: inline-block;
            padding: 0 30px;
        }
        .ticker-item span {
            color: #ff0033;
            margin-right: 10px;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        .main-header {
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(5px);
            border-bottom: 2px solid #ff0033;
        }
        .flex-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
        }
        .site-logo {
            grid-column: 1;
            justify-self: start;
        }
        .desktop-menu {
            grid-column: 2;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .desktop-menu a {
            color: #fff;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }
        .desktop-menu a:hover,
        .desktop-menu a.active {
            color: #ff0033;
        }
        .menu-toggle {
            background: #111 !important;
            border: 1px solid #333 !important;
            border-left: 3px solid #ff0033 !important;
            color: #fff !important;
            cursor: pointer;
            padding: 8px 14px !important;
            font-size: 18px !important;
            font-family: 'Oswald', sans-serif !important;
            text-transform: uppercase;
            display: none;
            justify-self: end;
        }
        .mobile-menu {
            display: none;
            position: absolute;
            top: calc(100% + 35px);
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.98);
            border-bottom: 3px solid #ff0033;
            padding: 20px 0;
            z-index: 999;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .mobile-menu.active {
            display: flex !important;
        }
        .mobile-menu a {
            color: #fff;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            display: block;
            width: 100%;
            text-align: center;
            padding: 10px;
        }
        .mobile-menu a:hover, 
        .mobile-menu a.active {
            color: #ff0033 !important;
            background: rgba(255, 0, 51, 0.05);
            border-left: 4px solid #ff0033;
            border-right: 4px solid #ff0033;
        }
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Hero Section */
        .hero-contact {
            position: relative;
            width: 100%;
            height: 40vh;
            min-height: 320px;
            background: linear-gradient(rgba(5, 5, 5, 0.5), rgba(5, 5, 5, 0.7)), url('./about-hero.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-bottom: 3px solid #ff0033;
            padding: 120px 20px 30px;
            box-sizing: border-box;
        }
        .hero-contact h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 3.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 10px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
        }
        .hero-contact h1 span {
            color: #ff0033;
            text-shadow: 0 0 25px rgba(255, 0, 51, 0.7);
        }
        .hero-contact p {
            color: rgba(220, 220, 220, 0.9);
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            max-width: 900px;
            margin: 0 auto;
        }

        /* Section Container */
        .content-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* Tabbed Control Bar */
        .contact-tabs-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .tab-trigger-btn {
            background: #111;
            color: #ccc;
            border: 1px solid #333;
            border-bottom: 3px solid #333;
            padding: 14px 28px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.25s ease;
        }
        .tab-trigger-btn:hover {
            color: #fff;
            border-color: #555;
            background: #181818;
        }
        .tab-trigger-btn.active {
            background: #ff0033;
            color: #ffffff;
            border-color: #ff0033;
            border-bottom-color: #b30024;
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.35);
        }

        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
            animation: fadeInPane 0.3s ease-in-out;
        }
        @keyframes fadeInPane {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Layout Grid */
        .contact-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        /* Card Styles */
        .form-card, .info-panel-card {
            background: #101010;
            border: 1px solid #222;
            border-left: 4px solid #ff0033;
            padding: 35px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-card h2, .info-panel-card h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .form-card p, .info-panel-card p {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #ccc;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #080808;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #ff0033;
        }
        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }
        .sms-btn {
            display: block;
            width: 100%;
            background-color: #ff0033;
            color: #ffffff;
            padding: 14px;
            font-size: 1.1rem;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.4);
        }
        .sms-btn:hover {
            background-color: #e0002c;
            transform: translateY(-2px);
        }

        .side-stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .action-card {
            background: #101010;
            border: 1px solid #222;
            border-left: 4px solid #ff0033;
            padding: 25px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
